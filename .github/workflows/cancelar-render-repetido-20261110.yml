name: Liberar envio do MP4 pronto de SP
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cancelar-render-repetido-20261110.yml']
permissions:
  contents: read
  actions: write
jobs:
  liberar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancelar apenas a execucao antiga travada nas dependencias
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="$GITHUB_REPOSITORY"
          run_id="42824802605"
          status="$(gh api "repos/$repo/actions/runs/$run_id" --jq '.status')"
          if [[ "$status" == completed ]]; then
            echo "Execucao antiga ja concluida; nenhuma acao."
            exit 0
          fi
          passo="$(gh api "repos/$repo/actions/runs/$run_id/jobs" --jq '[.jobs[].steps[]? | select(.status == "in_progress") | .name] | first // ""')"
          if [[ "$passo" == *"sudo apt-get update"* ]]; then
            gh api -X POST "repos/$repo/actions/runs/$run_id/cancel"
            echo "Execucao antiga cancelada enquanto instalava dependencias; o workflow de recuperacao reutilizara o MP4 ja gerado."
          else
            echo "A execucao antiga ja avancou para '$passo'; nao cancelar para evitar duplicidade."
          fi
