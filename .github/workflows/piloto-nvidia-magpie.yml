name: "Piloto NVIDIA Magpie — O Tempo SP (sem publicar)"
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/piloto-nvidia-magpie.yml"
      - "scripts/piloto_nvidia_magpie.py"
permissions:
  contents: read
concurrency:
  group: piloto-nvidia-sp
  cancel-in-progress: false
jobs:
  piloto:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MAGPIE_DEVICE: cpu
      OMP_NUM_THREADS: "4"
      MAGPIE_MODEL: /tmp/magpie-tts-multilingual-357m-q8_0.gguf
      MAGPIE_CLI: /tmp/magpie-tts.cpp/build/examples/cli/magpie-cli
      HYPERFRAMES_NO_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-hyperframes
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependências de vídeo e vozes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libcairo2-dev libpango1.0-dev pkg-config build-essential cmake git curl
          python -m pip install -r requirements-voice.txt ffmpeg-normalize
      - name: Compilar Magpie CPU
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/mudler/magpie-tts.cpp /tmp/magpie-tts.cpp
          cmake -S /tmp/magpie-tts.cpp -B /tmp/magpie-tts.cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/magpie-tts.cpp/build -j 4
          test -x "$MAGPIE_CLI"
      - name: Baixar modelo NVIDIA Q8
        run: |
          curl -fL --retry 4 --retry-delay 5 "https://huggingface.co/mudler/magpie-tts.cpp-gguf/resolve/main/magpie-tts-multilingual-357m-q8_0.gguf?download=true" -o "$MAGPIE_MODEL"
          test "$(stat -c %s "$MAGPIE_MODEL")" -gt 600000000
      - name: Renderizar vídeo Bira e Bia com NVIDIA (dados ilustrativos)
        run: |
          mkdir -p output
          python scripts/piloto_nvidia_magpie.py --turno amanhã --qualidade draft --out output/piloto-nvidia-otemposp.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/piloto-nvidia-otemposp.mp4
      - name: Arquivos do piloto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piloto-nvidia-otemposp
          path: |
            output/piloto-nvidia-otemposp.mp4
            output/piloto-nvidia-otemposp.json
            output/piloto-nvidia-otemposp.txt
          if-no-files-found: warn
          retention-days: 7
