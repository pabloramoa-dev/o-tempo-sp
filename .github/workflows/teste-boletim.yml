name: Teste do boletim (sem publicar) — O Tempo SP
# Gera o vídeo com previsão REAL e guarda como artefato. Nunca fala com a Meta.
on:
  push:
    branches: ['melhorias-*']
  workflow_dispatch:
    inputs:
      turno:
        type: choice
        options: [hoje, amanhã]
        default: amanhã
permissions:
  contents: read
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TURNO: ${{ inputs.turno || 'amanhã' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-hyperframes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg espeak-ng
      - run: pip install -r requirements-voice.txt pytest
      - run: python -m pytest -q
      - name: Gerar vídeo de teste com previsão real
        run: python -m scripts.live "$TURNO"
      - name: Legenda no resumo da execução
        if: always()
        run: |
          if [ -f output/legenda.txt ]; then
            { echo '### Legenda gerada'; echo '```'; cat output/legenda.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teste-boletim-${{ env.TURNO }}
          path: |
            output/*.mp4
            output/*.json
            output/*.txt
          retention-days: 7
