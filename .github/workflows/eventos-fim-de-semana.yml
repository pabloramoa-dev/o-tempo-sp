name: Pauta semanal - tempo nos 2 maiores eventos SP
on:
  schedule:
    - cron: '0 13 * * 5' # sexta 10h no horario de Brasilia (UTC-3)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pauta_eventos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Atualizar catálogo de eventos (só o que a fonte confirma)
        id: catalogo
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +e
          python -m scripts.atualizar_catalogo_eventos
          rc=$?
          if [ "$rc" = "3" ]; then echo "seguir=nao" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "seguir=sim" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Checar agenda e consultar previsao horaria
        if: steps.catalogo.outputs.seguir == 'sim'
        run: python -m scripts.eventos_fim_de_semana
      - uses: actions/upload-artifact@v4
        with:
          name: eventos-sp-${{ github.run_id }}
          path: output/eventos_fim_de_semana/
          if-no-files-found: warn
          retention-days: 7
