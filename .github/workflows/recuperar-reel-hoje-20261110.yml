name: Recuperar envio do Reel de 10-11-2026 (sem novo render)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recuperar-reel-hoje-20261110.yml']
  workflow_dispatch:
    inputs:
      run_id:
        description: ID da execucao que gerou MP4
        type: string
        default: '42823364419'
      publicar:
        description: Publicar depois da verificacao
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
jobs:
  recuperar:
    if: github.event_name == 'push' || inputs.publicar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: instagram-otemposp
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencia de envio
        run: python -m pip install "requests>=2.31,<3" "PyYAML>=6,<7"
      - name: Restaurar MP4 e metadados originais
        env:
          GH_TOKEN: ${{ github.token }}
          ARTEFATO_RUN_ID: ${{ inputs.run_id || '42823364419' }}
        run: |
          mkdir -p output
          gh run download "$ARTEFATO_RUN_ID" --repo "$GITHUB_REPOSITORY" --name boletim-hoje --dir output
          test -s output/bira.mp4
          test -s output/brief.json
          test -s output/snapshot.json
      - name: Confirmar dados atuais e entregar a Meta sem duplicar
        env:
          GH_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
        run: python -m scripts.distribute live
