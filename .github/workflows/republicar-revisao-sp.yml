name: Republicar Reel revisado — O Tempo SP
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/republicar-revisao-sp.yml'
permissions:
  contents: write
  actions: read
jobs:
  republicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: instagram-otemposp-revisao
      cancel-in-progress: false
    env:
      REEL_REPUBLICACAO: revisao-capa-temp-20261108
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Reutilizar MP4 com previsão real e capa corrigida
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          gh run download 42545129882 --repo "$GITHUB_REPOSITORY" --name "boletim-amanhã" --dir output
          test -s output/bia.mp4
          test -s output/brief.json
          test -s output/snapshot.json
      - name: Publicar o único Reel revisado
        env:
          GH_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
        run: python -m scripts.distribute live
