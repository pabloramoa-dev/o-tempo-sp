name: Prévia real com volume de chuva — O Tempo SP
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/previa-chuva-real.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video-real-amanha:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-hyperframes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng libcairo2-dev libpango1.0-dev pkg-config
          pip install -r requirements-voice.txt pytest
      - name: Testar tabela e dados de chuva
        run: python -m pytest -q tests/test_agrupamento_temperaturas.py tests/test_destaque_chuva.py
      - name: Gerar vídeo de amanhã usando previsão real MET Norway
        run: python -m scripts.live "amanhã"
      - name: Validar MP4 e fonte real
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import json
          from pathlib import Path
          brief = json.loads(Path('output/brief.json').read_text())
          snapshot = json.loads(Path('output/snapshot.json').read_text())
          expected = (datetime.now(ZoneInfo('America/Sao_Paulo')).date() + timedelta(days=1)).isoformat()
          assert brief['date'] == expected, (brief['date'], expected)
          assert snapshot['is_fixture'] is False
          assert 'MET Norway' in snapshot['source']
          assert len(brief['cards']) == 11, len(brief['cards'])
          assert all(isinstance(c['rain_mm'], (int,float)) for c in brief['cards'])
          assert Path('output/bia.mp4').stat().st_size > 100000
          print('Prévia real validada para', expected)
          PY
          ffprobe -v error -show_entries format=duration,size -of json output/bia.mp4
      - name: Entregar MP4 para avaliação sem publicar no Instagram
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: previa-chuva-sp-real
          path: |
            output/bia.mp4
            output/bia.json
            output/bia.txt
            output/brief.json
            output/snapshot.json
          if-no-files-found: warn
          retention-days: 3
