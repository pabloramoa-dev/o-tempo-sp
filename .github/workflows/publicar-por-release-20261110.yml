name: Publicar SP por URL publica (recuperacao de 10-11)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-por-release-20261110.yml']
  workflow_dispatch:
    inputs:
      publicar:
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
jobs:
  publicar:
    if: github.event_name == 'push' || inputs.publicar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: instagram-otemposp
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias minimas
        run: python -m pip install "requests>=2.31,<3" "PyYAML>=6,<7"
      - name: Restaurar boletim real ja renderizado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          gh run download 42823364419 --repo "$GITHUB_REPOSITORY" --name boletim-hoje --dir output
          test -s output/bira.mp4
          test -s output/snapshot.json
          test -s output/brief.json
      - name: Hospedar MP4 por Release publico do GitHub
        id: hospedagem
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          visivel="$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)"
          test "$visivel" = public || { echo "Repositorio nao e publico; Meta nao pode baixar o video."; exit 1; }
          tag="reel-recuperacao-20261110-$GITHUB_RUN_ID"
          gh release create "$tag" output/bira.mp4 --title "$tag" --notes "Recuperacao do boletim real de 10 de novembro"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/bira.mp4"
          echo "REEL_PUBLIC_URL=$url" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Enviar via video_url e confirmar Reel e Story
        env:
          GH_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
        run: python -m scripts.publicar_via_url
      - name: Limpar Release somente apos confirmacao
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.hospedagem.outputs.tag }}
        run: gh release delete "$TAG" --cleanup-tag --yes
