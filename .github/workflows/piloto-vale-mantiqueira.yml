name: Piloto real Vale e Mantiqueira (sem publicar)
on:
  push:
    branches: [expansao-vale-mantiqueira]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  piloto:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-hyperframes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg espeak-ng
      - run: pip install -r requirements-voice.txt pytest
      - run: python -m pytest -q
      - name: Gerar piloto real de hoje com Bira e Bia, sem publicar
        run: python -m scripts.live hoje
        env:
          SP_FORMATO: dupla
      - uses: actions/upload-artifact@v4
        with:
          name: piloto-vale-mantiqueira
          path: |
            output/*.mp4
            output/*.json
            output/*.txt
          retention-days: 7
