name: Publicar Reels e Story — O Tempo SP
on:
  schedule:
    - cron: '25 8 * * *'
    - cron: '25 20 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/reels.yml', 'scripts/distribute.py', 'scripts/met_forecast.py', 'scripts/live.py']
  workflow_dispatch:
    inputs:
      turno:
        type: choice
        options: [hoje, amanhã]
        default: amanhã
      publicar:
        type: boolean
        default: false
        description: Publicar no Instagram
permissions:
  contents: read
jobs:
  boletim:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    permissions:
      contents: write
    concurrency:
      group: instagram-otemposp
      cancel-in-progress: false
    env:
      TURNO: ${{ inputs.turno || (github.event.schedule == '25 8 * * *' && 'hoje') || 'amanhã' }}
      LIVE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publicar) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-hyperframes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg espeak-ng
      - run: pip install -r requirements-voice.txt pytest
      - run: python -m pytest -q
      - name: Gerar edição com previsão real
        run: python -m scripts.live "$TURNO"
      - uses: actions/upload-artifact@v4
        with:
          name: boletim-${{ env.TURNO }}
          path: |
            output/*.mp4
            output/*.json
            output/*.txt
          retention-days: 7
      - name: Aguardar horário do boletim
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os,time
          now=datetime.now(ZoneInfo("America/Sao_Paulo"))
          target=now.replace(hour=6 if os.environ["TURNO"]=="hoje" else 18,minute=0,second=0,microsecond=0)
          delay=(target-now).total_seconds()
          if delay < -7200 or delay > 3600:
              raise SystemExit("Fora da janela do boletim")
          time.sleep(max(0,delay))
          PY
      - name: Entregar MP4 à Meta
        env:
          GH_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
        run: |
          if [ "$LIVE" = "true" ]; then
            python -m scripts.distribute live
          else
            python -m scripts.distribute validar
          fi
