name: Publicar Reels e Story — O Tempo SP
on:
  # Tentativas antecipadas e redundantes para diminuir falhas do agendador.
  # São Paulo: 05:13/05:41 (boletim 06h), 17:13/17:41 (boletim 18h).
  schedule:
    - cron: '13 8 * * *'
    - cron: '41 8 * * *'
    - cron: '13 20 * * *'
    - cron: '41 20 * * *'
  repository_dispatch:
    types: [boletim_hoje, boletim_amanha]
  push:
    branches: [main]
    paths: ['.github/workflows/reels.yml', 'scripts/distribute.py', 'scripts/met_forecast.py', 'scripts/live.py']
  workflow_dispatch:
    inputs:
      turno:
        type: choice
        options: [hoje, amanhã]
        default: amanhã
      publicar:
        type: boolean
        default: false
        description: Publicar no Instagram
permissions:
  contents: read
jobs:
  boletim:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    permissions:
      contents: write
    concurrency:
      group: instagram-otemposp
      cancel-in-progress: false
    env:
      TURNO: ${{ inputs.turno || (github.event_name == 'repository_dispatch' && github.event.action == 'boletim_hoje' && 'hoje') || (github.event_name == 'push' && (github.event.head_commit.message == 'PUBLICAR_HOJE_OTEMPOSP_20261109' || (github.event.head_commit.message == 'REPUBLICAR_HOJE_CHUVA_OTEMPOSP_20261109' || github.event.head_commit.message == 'PUBLICAR_HOJE_OTEMPOSP_20261110')) && 'hoje') || (github.event_name == 'schedule' && (github.event.schedule == '13 8 * * *' || github.event.schedule == '41 8 * * *') && 'hoje') || 'amanhã' }}
      LIVE: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.publicar) || (github.event_name == 'push' && (github.event.head_commit.message == 'PUBLICAR_REVISAO_OTEMPOSP_20261108' || github.event.head_commit.message == 'PUBLICAR_HOJE_OTEMPOSP_20261109' || github.event.head_commit.message == 'REPUBLICAR_HOJE_CHUVA_OTEMPOSP_20261109' || (github.event.head_commit.message == 'PUBLICAR_AGORA_OTEMPOSP_20261109' || github.event.head_commit.message == 'PUBLICAR_HOJE_OTEMPOSP_20261110'))) }}
      REEL_REPUBLICACAO: ${{ github.event_name == 'push' && github.event.head_commit.message == 'REPUBLICAR_HOJE_CHUVA_OTEMPOSP_20261109' && 'chuva-final-bira-20261109' || github.event.head_commit.message == 'PUBLICAR_REVISAO_OTEMPOSP_20261108' && 'revisao-capa-temp-20261108' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-hyperframes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg espeak-ng
      - run: pip install -r requirements-voice.txt pytest
      - run: python -m pytest -q
      - name: Gerar edição com previsão real
        run: python -m scripts.live "$TURNO"
      - uses: actions/upload-artifact@v4
        with:
          name: boletim-${{ env.TURNO }}
          path: |
            output/*.mp4
            output/*.json
            output/*.txt
          retention-days: 7
      - name: Validar janela do boletim (agendamento)
        id: janela
        if: github.event_name == 'schedule' || github.event_name == 'repository_dispatch'
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os, time
          now = datetime.now(ZoneInfo("America/Sao_Paulo"))
          target = now.replace(hour=6 if os.environ["TURNO"] == "hoje" else 18,
                               minute=0, second=0, microsecond=0)
          delay = (target - now).total_seconds()
          if delay < -5400 or delay > 3600:
              print(f"Agendamento fora da janela: {now:%H:%M}, turno={os.environ['TURNO']}. Publicacao cancelada para evitar previsao vencida.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("ok=false\\n".replace("\\n", "\n"))
          else:
              time.sleep(max(0, delay))
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("ok=true\\n".replace("\\n", "\n"))
          PY
      - name: Entregar MP4 à Meta
        if: github.event_name != 'schedule' && github.event_name != 'repository_dispatch' || steps.janela.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
        run: |
          set -euo pipefail
          if [ "$LIVE" = "true" ]; then
            if [ "$TURNO" = "hoje" ]; then video="output/bira.mp4"; else video="output/bia.mp4"; fi
            test -s "$video"
            visibilidade="$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)"
            test "$visibilidade" = public || { echo "Repositorio privado: a Meta nao pode baixar o video."; exit 1; }
            tag="boletim-sp-$GITHUB_RUN_ID"
            gh release create "$tag" "$video" --title "$tag" --notes "Boletim diario @otemposp"
            REEL_PUBLIC_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$(basename "$video")" python -m scripts.publicar_via_url
            gh release delete "$tag" --cleanup-tag --yes
          else
            python -m scripts.publicar_via_url --validar
          fi
